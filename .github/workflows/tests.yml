name: Environment and installation checks
on: [push, pull_request]
jobs:
  environment:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m pip wheel . --no-deps -w dist
      - run: python -m pip install --no-deps --force-reinstall dist/*.whl
      - name: Run installed package outside checkout
        run: |
          cd "${{ runner.temp }}"
          python -c "import forklift_gym, gymnasium as gym; from forklift_gym import Map; assert 'empty_arena' in Map.list_presets(); e=gym.make('Forklift-v0'); o,_=e.reset(seed=7); assert o.shape==(44,); e.close()"
      - run: python examples/random_rollout.py --steps 3
      - run: python examples/moving_agents.py --steps 8
      - run: python examples/custom_scenario.py
  sb3:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ".[sb3]"
      - run: python examples/train_ppo.py --steps 128 --rollout 64 --batch-size 32 --epochs 1 --traffic 2 --obstacles 2 --max-steps 16 --output outputs/ci
      - run: python examples/plot_rewards.py --log outputs/ci/training.monitor.csv --output outputs/ci/replotted.png
      - run: python examples/run_model.py --run outputs/ci --case normal_1 --max-steps 8
      - run: python examples/evaluate.py --run outputs/ci --max-steps 8
      - run: python examples/record_video.py --run outputs/ci --case dynamic_2 --max-steps 8 --output outputs/ci/demo.mp4
